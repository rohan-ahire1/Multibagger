market:
  timezone: "Asia/Kolkata"
  benchmark_symbol: "NIFTYBEES"
  scan_time_ist: "16:10"

data:
  redownload_days: 5
  min_history_days: 320
  http_timeout_sec: 30
  max_retries: 5

universe:
  allowed_series: ["EQ"]
  min_price_inr: 50
  min_adv50_inr: 50000000
  min_avg_volume_shares: 200000
  max_symbols: 1500

trend_template:
  sma_fast: 50
  sma_mid: 150
  sma_slow: 200
  lookback_52w: 252
  sma200_slope_lookback: 21
  min_above_52w_low_pct: 0.10
  max_below_52w_high_pct: 0.45

relative_strength:
  lookbacks: [63]
  weights: [1.0]
  rs_rank_min: 40
  rs_rank_max: 100.0
  skip_recent_days: 0

setup_vcp:
  base_lookback: 65
  max_range10_pct: 0.08
  max_vol_dryup_ratio: 2.0
  atr_period: 14
  atr_contraction_factor: 1.2
  max_extension_from_50sma_pct: 0.40
  base_max_depth_pct: 0.60
  pre_alert_proximity_pct: 0.05
  contraction_smooth_window: 5
  contraction_min_peak_pct: 0.01
  contraction_min_count: 0
  contraction_max_count: 2
  contraction_standard_count: 3

breakout:
  require_market_filter: false
  breakout_buffer_pct: 0.003
  breakout_buffer_atr_mult: 0.5
  breakout_vol_mult: 1.0
  breakout_vol_max_mult: 20.0
  max_extension_breakout_pct: 0.30

risk:
  entry_buffer_pct: 0.003
  entry_buffer_atr_mult: 0.5
  max_stop_pct: 0.07
  struct_stop_atr_mult: 1.0
  target_r: null

backtest:
  pending_days: 8
  max_hold_days: 150
  exit_mode: baseline_ema21
  use_regime_entry_controls: false
  use_extended_exit_model: false
  max_signals_per_day: 20
  signal_ranking_mode: default
  rs_rank_min: 70
  rs_rank_max: 100.0
  sector_alpha_enabled: false
  skip_months: [1]
  signal_quality_range10_max: 0.08
  signal_quality_voldry_max: 0.9
  signal_quality_setup_streak_max: 0   # fresh setups only — streak decays WR fast

alerts:
  max_alerts_per_day: 50
  send_watch_alerts: true
  send_breakout_alerts: true
  channels: ["telegram", "console"]

market_filter:
  benchmark_ema_period: 21
  breadth_strong_pct: 0.40
  breadth_weak_pct: 0.20

portfolio:
  max_positions: 20
  max_sector_positions: 4
  initial_capital: 1000000
  risk_per_trade_pct: 0.020
  max_name_pct: 0.20
  max_heat_pct: 1.0
  max_sector_pct: 1.0
  drawdown_half_pct: 0.50
  drawdown_stop_pct: 0.60
  drawdown_close_pct: 0.70
  regime_gate_enabled: true
  pyramid_max_adds: 0

# Minervini earnings-growth gate on breakouts. OFF until full survivorship-clean
# data is sourced (current prototype data is partial/recent, survivorship-biased).
# When on: drops breakouts whose point-in-time earnings YoY growth < min_yoy_growth;
# symbols without data are kept (pass_if_missing). Validated to improve Calmar/DD.
fundamental_gate:
  enabled: false
  data_path: data/reference/screener_annual.csv
  freq: annual
  min_yoy_growth: 0.25
  reporting_lag_days: 75
  pass_if_missing: true

watchlist:
  max_candidates: 1000

# LOCKED exit set — walk-forward-robust under RS>=70 (best worst-window Calmar,
# 0 negative 2y windows, ~20.7% CAGR / 1.14 Calmar over 2010-2026). Single source
# of truth: terminal backtest, paper runner, and UI all read these.
exit_strategy:
  max_loss_pct: 0.07
  absolute_max_loss_pct: 0.07
  breakeven_activation_r: 2.0
  partial_profit_r: 8.0
  time_stop_days: null
  trail_pct_bull: 0.25
  trail_pct_bear: 0.15
  trail_widen_r: 3.0
