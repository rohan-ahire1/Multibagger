[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sepa-scanner-nse"
version = "0.1.0"
description = "Local ultrafast NSE SEPA-inspired swing scanner"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Codex" }
]
dependencies = [
  "duckdb>=1.1.3",
  "numpy>=1.26",
  "polars>=1.18.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
  "rich>=13.9.4",
  "tenacity>=9.0.0",
  "typer>=0.15.1",
  "fastapi[standard]>=0.115.0",
  "uvicorn>=0.34.0",
  "pyarrow>=23.0.1",
  "yfinance>=0.2.65",
]

[project.scripts]
sepa = "sepa_scanner.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sepa_scanner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Slow tests load the full price panel and run multi-minute simulations, so they
# are opt-in: `pytest -m slow` (or `-m ""` for everything). The lab parity gate
# lives there — run it before trusting any backtest change.
addopts = "-m 'not slow'"
markers = [
  "slow: loads the full panel and runs a full-history simulation (minutes)",
]
